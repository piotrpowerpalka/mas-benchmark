services:

  serverhello:
    image: tigase/tigase-xmpp-server:8.1.2
    ports:
      - "8480:8080"
      - "5422:5222"
    environment:
      - DB_ROOT_USER=admin
      - DB_ROOT_PASS=admin
      - ADMIN_JID=admin@serverhello
      - ADMIN_PASSWORD=admin
    volumes:
      - ./tigase/config/tigase.conf:/home/tigase/tigase-server/etc/tigase.conf
      - ./tigase/config/config.tdsl:/home/tigase/tigase-server/etc/config.tdsl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/rest/health"]
#      test: ["CMD", "nc", "-z", "localhost", "5222"]
      interval: 15s
      timeout: 5s
      retries: 5

  mas1:
    image: mas:latest
    build:
      context: .
#    command: python -u main.py -f 0 -t 4 -n 10 -r 2 -x 1048576 -i 0
#    command: python -u main.py -f 0 -t 9 -n 10 -r 1 -x 1024 -i 1 -c query
#    command: python -u main.py -f 0 -t 9 -n 10 -r 1 -x 1024 -i 1 -c inform
    command: python -u main.py -f 0 -t 9 -n 10 -r 1 -x 1024 -i 1 -c cfp -g 3
    deploy:
      resources:
        limits:
          memory: 512MB

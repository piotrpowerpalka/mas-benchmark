services:

  jademas1:
    image: jademas:latest
    build:
      context: .
      dockerfile: Dockerfile.jade
    command: java -cp /app/jade.jar:. Main -f 0 -t 99 -n 100 -r 100 -x 1024 -i 1 -c inform -g 30 
    deploy:
      resources:
        limits:
          memory: 128MB
    networks:
      - xmpp_net
  jadeserver: 
    image: jadeserver:latest
    container_name: serverhello
    hostname: serverhello
    build:
      context: .
      dockerfile: Dockerfile.jade
    command: java -cp /app/jade.jar:. jade.Boot -container -host serverhello -port 1099 
    deploy:
      resources:
        limits:
          memory: 128MB
    networks:
      - xmpp_net

networks:
  xmpp_net:
    driver: bridge
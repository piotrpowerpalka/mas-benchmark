services:

  jademas1:
    image: jademas:latest
    build:
      context: .
      dockerfile: Dockerfile.jade
    #command: java -cp /app/jade.jar jade.Boot -container -host serverhello -port 1099 -agent mas0:InitAgent mas1:InformAgent
    command: java -cp /app/jade.jar Main
    deploy:
      resources:
        limits:
          memory: 128MB
    networks:
      - xmpp_net
  jadeserver: 
    image: jadeserver:latest
    container_name: serverhello
    hostname: serverhello
    build:
      context: .
      dockerfile: Dockerfile.jade
    command: java -cp /app/jade.jar jade.Boot -port 1099
    deploy:
      resources:
        limits:
          memory: 128MB
    networks:
      - xmpp_net

networks:
  xmpp_net:
    driver: bridge